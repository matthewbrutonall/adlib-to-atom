[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adlib-to-atom"
version = "0.1.0"
description = "Axiell Adlib XML to AtoM ISAD(G) CSV converter"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Archive Hosting UK", email = "hello@archiveshosting.co.uk"}
]
dependencies = []

[project.urls]
Homepage = "https://github.com/matthewbrutonall/adlib-to-atom"

[project.scripts]
adlib-to-atom = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools]
py-modules = ["adlib_core", "cli"]
