[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adlib-to-atom"
version = "0.1.0"
description = "Axiell Adlib XML to AtoM ISAD(G) CSV converter"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools]
py_modules = ["adlib_core", "cli"]
